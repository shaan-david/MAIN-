<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>REVA Academy – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #7c5cbf;
      --accent-dark: #5e3fa3;
      --accent-light: #f3eeff;
      --gold: #c9860a;
      --gold-light: #fff8ec;
      --text: #1a1a2e;
      --text-2: #6b7280;
      --border: #e8e0f5;
      --bg: #f7f4fc;
      --white: #ffffff;
      --danger: #ef4444;
      --success: #10b981;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(145deg, #ede8f9 0%, #f5f0ff 40%, #fdf8ff 100%);
      position: relative;
      overflow: hidden;
    }
    /* Subtle decorative blobs */
    body::before {
      content: '';
      position: fixed;
      top: -120px; left: -120px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(124,92,191,.13) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; right: -80px;
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(201,134,10,.10) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .login-wrap {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    /* Top logo card */
    .logo-card {
      background: var(--white);
      border-radius: 20px 20px 0 0;
      border: 1.5px solid var(--border);
      border-bottom: none;
      padding: 28px 36px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 24px rgba(124,92,191,.08);
    }
    .logo-card img {
      width: 200px;
      height: auto;
      display: block;
    }
    .logo-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin-top: 4px;
    }
    .logo-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    /* Main form card */
    .login-card {
      background: var(--white);
      border-radius: 0 0 20px 20px;
      border: 1.5px solid var(--border);
      border-top: none;
      padding: 28px 36px 36px;
      box-shadow: 0 8px 40px rgba(124,92,191,.10);
    }

    .tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 26px;
      gap: 4px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 9px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-2);
      transition: all .2s;
    }
    .tab-btn.active {
      background: var(--white);
      color: var(--accent);
      box-shadow: 0 1px 6px rgba(124,92,191,.15);
    }

    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }
    .input-wrap { position: relative; }
    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #b8a9d9;
      font-size: 14px;
      pointer-events: none;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 14px 11px 42px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: var(--bg);
    }
    input:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(124,92,191,.10);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      margin-top: 4px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: .3px;
      box-shadow: 0 4px 16px rgba(124,92,191,.30);
    }
    .btn-submit:hover { opacity: .92; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .error-msg {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .success-msg {
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-note {
      text-align: center;
      font-size: 11.5px;
      color: #c0b4d8;
      margin-top: 20px;
      letter-spacing: .3px;
    }
  </style>
</head>

    <!-- Form Card -->
    <div class="login-card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">
          <i class="fa-solid fa-right-to-bracket" style="margin-right:5px;font-size:12px;"></i> Sign In
        </button>
        <button class="tab-btn" onclick="switchTab('register')">
          <i class="fa-solid fa-user-plus" style="margin-right:5px;font-size:12px;"></i> Register
        </button>
      </div>

      <!-- LOGIN FORM -->
      <div class="form-panel active" id="panel-login">
        <div class="error-msg" id="login-error"></div>
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username"/>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password"/>
          </div>
        </div>
        <button class="btn-submit" id="login-btn" onclick="doLogin()">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </div>

      <!-- REGISTER FORM -->
      <div class="form-panel" id="panel-register">
        <div class="error-msg" id="register-error"></div>
        <div class="success-msg" id="register-success"></div>
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrap">
            <i class="fa-solid fa-id-card"></i>
            <input type="text" id="reg-name" placeholder="Your full name"/>
          </div>
        </div>
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="reg-username" placeholder="Choose a username"/>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="reg-password" placeholder="Create a password"/>
          </div>
        </div>
        <button class="btn-submit" id="register-btn" onclick="doRegister()">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </div>

      <div class="footer-note">© REVA Academy for Corporate Excellence</div>
    </div>
  </div>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.getElementById('panel-login').classList.toggle('active', tab === 'login');
    document.getElementById('panel-register').classList.toggle('active', tab === 'register');
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideMsg(id) { document.getElementById(id).style.display = 'none'; }

  async function doLogin() {
    hideMsg('login-error');
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) { showError('login-error', 'Please fill in all fields.'); return; }
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      const d = await res.json();
      showError('login-error', d.message || 'Login failed.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
    }
  }

  async function doRegister() {
    hideMsg('register-error');
    hideMsg('register-success');
    const name = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!name || !username || !password) { showError('register-error', 'Please fill in all fields.'); return; }
    const btn = document.getElementById('register-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating account…';
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, username, password })
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      const d = await res.json();
      showError('register-error', d.message || 'Registration failed.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const activePanel = document.querySelector('.form-panel.active').id;
      if (activePanel === 'panel-login') doLogin();
      else doRegister();
    }
  });
</script>
</body>
</html>
